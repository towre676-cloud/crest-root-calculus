<svg xmlns="http://www.w3.org/2000/svg" width="780" height="434" viewBox="0 0 780 434" role="img" aria-labelledby="title desc">
<title id="title">How long can a false candidate survive?</title>
<desc id="desc">All four quartics reduce to the Fermat quartic modulo 13, with 16 degree-three quotient classes and two marked points per class. The Fermat curve has 16 exact geometric classes. Adding 13, 169 or 2197 times the displayed polynomial rules out all classes at modulus 169, 2197 or 28561 respectively.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b39}
.math{font-family:Georgia,"Times New Roman","DejaVu Serif",serif}

</style>
<rect width="780" height="434" fill="#fff"/>
<text x="24" y="42" text-anchor="start" class="math" font-size="34" font-weight="400" style="fill:#172b39">How long can a false candidate survive?</text>
<text x="24" y="77" text-anchor="start" class="" font-size="21" font-weight="400" style="fill:#435c69">Each new test keeps one more base-13 digit in the equations.</text>
<text x="24" y="119" text-anchor="start" class="math" font-size="23" font-weight="400" style="fill:#172b39">F = X⁴ + Y⁴ + Z⁴</text>
<text x="326" y="119" text-anchor="start" class="math" font-size="23" font-weight="400" style="fill:#172b39">D = −5X²Z² − 4Y²Z²</text>
<path d="M24 137 L756 137" fill="none" stroke="#d7e0e2" stroke-width="1"/>
<text x="24" y="178" text-anchor="start" class="" font-size="19" font-weight="700" style="fill:#172b39">Quartic</text>
<text x="231" y="178" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#172b39">mod 13</text>
<text x="346" y="178" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#172b39">mod 169</text>
<text x="461" y="178" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#172b39">mod 2,197</text>
<text x="576" y="178" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#172b39">mod 28,561</text>
<text x="702" y="178" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#172b39">Exact count</text>
<path d="M24 193 L756 193" fill="none" stroke="#d7e0e2" stroke-width="1"/>
<path d="M638 154 L638 397" fill="none" stroke="#d7e0e2" stroke-width="1"/>
<text x="24" y="230" text-anchor="start" class="math" font-size="21" font-weight="400" style="fill:#172b39">F = 0</text>
<path d="M231 223 L346 223" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M346 223 L461 223" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M461 223 L576 223" fill="none" stroke="#77a9a3" stroke-width="2"/>
<circle cx="231" cy="223" r="17" fill="#00766b"/>
<text x="231" y="229" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="346" cy="223" r="17" fill="#00766b"/>
<text x="346" y="229" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="461" cy="223" r="17" fill="#00766b"/>
<text x="461" y="229" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="576" cy="223" r="17" fill="#00766b"/>
<text x="576" y="229" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<text x="702" y="231" text-anchor="middle" class="" font-size="26" font-weight="700" style="fill:#00766b">16</text>
<text x="24" y="281" text-anchor="start" class="math" font-size="21" font-weight="400" style="fill:#172b39">F + 13D = 0</text>
<path d="M231 274 L346 274" fill="none" stroke="#91796d" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="231" cy="274" r="17" fill="#00766b"/>
<text x="231" y="280" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<path d="M346 255l19 19-19 19-19-19z" fill="#fff8f5" stroke="#b34826" stroke-width="2.4"/>
<text x="346" y="281" text-anchor="middle" class="" font-size="20" font-weight="700" style="fill:#b34826">0</text>
<text x="702" y="282" text-anchor="middle" class="" font-size="26" font-weight="700" style="fill:#b34826">0</text>
<text x="24" y="332" text-anchor="start" class="math" font-size="21" font-weight="400" style="fill:#172b39">F + 13²D = 0</text>
<path d="M231 325 L346 325" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M346 325 L461 325" fill="none" stroke="#91796d" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="231" cy="325" r="17" fill="#00766b"/>
<text x="231" y="331" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="346" cy="325" r="17" fill="#00766b"/>
<text x="346" y="331" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<path d="M461 306l19 19-19 19-19-19z" fill="#fff8f5" stroke="#b34826" stroke-width="2.4"/>
<text x="461" y="332" text-anchor="middle" class="" font-size="20" font-weight="700" style="fill:#b34826">0</text>
<text x="702" y="333" text-anchor="middle" class="" font-size="26" font-weight="700" style="fill:#b34826">0</text>
<text x="24" y="383" text-anchor="start" class="math" font-size="21" font-weight="400" style="fill:#172b39">F + 13³D = 0</text>
<path d="M231 376 L346 376" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M346 376 L461 376" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M461 376 L576 376" fill="none" stroke="#91796d" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="231" cy="376" r="17" fill="#00766b"/>
<text x="231" y="382" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="346" cy="376" r="17" fill="#00766b"/>
<text x="346" y="382" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="461" cy="376" r="17" fill="#00766b"/>
<text x="461" y="382" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<path d="M576 357l19 19-19 19-19-19z" fill="#fff8f5" stroke="#b34826" stroke-width="2.4"/>
<text x="576" y="383" text-anchor="middle" class="" font-size="20" font-weight="700" style="fill:#b34826">0</text>
<text x="702" y="384" text-anchor="middle" class="" font-size="26" font-weight="700" style="fill:#b34826">0</text>
<text x="24" y="422" text-anchor="start" class="" font-size="18" font-weight="400" style="fill:#435c69">Numbers count degree-three quotient classes. A row ends when every lift fails.</text>
</svg>
