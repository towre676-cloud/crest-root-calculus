<text x="213.00" y="114.00" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#00766b">Two lines paired</text>
<text x="66.00" y="138.00" font-size="15" font-weight="400" text-anchor="start" class="" style="fill:#465e6d">Running product</text>
<path d="M67.00 323.00L728.00 323.00" stroke="#d7e2e6" stroke-width="1.2" fill="none" />
<text x="59.00" y="328.00" font-size="16" font-weight="400" text-anchor="end" class="" style="fill:#465e6d">0</text>
