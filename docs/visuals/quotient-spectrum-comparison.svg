<svg xmlns="http://www.w3.org/2000/svg" width="820" height="610" viewBox="0 0 820 610" role="img" aria-labelledby="title desc">
  <title id="title">Elliptic quotient spectra for two certified curve pairs</title>
  <desc id="desc">Counts of optimal geometric elliptic quotient classes at degrees 2 through 10. The discriminant minus 19 curves first differ at degree three, with zero versus four classes. For the determinant 1440 curves the markers overlap at every plotted degree. A separate theorem proves equality in all degrees.</desc>
