<text x="59.00" y="287.53" font-size="16" font-weight="400" text-anchor="end" class="" style="fill:#465e6d">4</text>
<path d="M67.00 242.06L728.00 242.06" stroke="#d7e2e6" stroke-width="1.2" fill="none" />
<text x="59.00" y="247.06" font-size="16" font-weight="400" text-anchor="end" class="" style="fill:#465e6d">8</text>
<path d="M67.00 201.59L728.00 201.59" stroke="#d7e2e6" stroke-width="1.2" fill="none" />
<text x="59.00" y="206.59" font-size="16" font-weight="400" text-anchor="end" class="" style="fill:#465e6d">12</text>
