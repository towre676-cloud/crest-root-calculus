<text x="17.00" y="69.00" font-size="29" font-weight="400" text-anchor="start" class="serif" style="fill:#172b39">prime by prime</text>
<text x="17.00" y="100.00" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#465e6d">Every jump introduces one new prime.</text>
