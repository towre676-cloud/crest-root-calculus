<svg xmlns="http://www.w3.org/2000/svg" width="380" height="547" viewBox="0 0 380 547" role="img" aria-labelledby="title desc"><title id="title">Multiplying the counts, prime by prime</title><desc id="desc">A step graph for primes up to 31. One projective line gives the lower product. The product of two lines gives the square at every prime. At 5 the exact values are 2.4 and 5.76.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b39}.serif{font-family:Georgia,"Times New Roman",serif}.pulse{opacity:0}.moving{display:inline}@keyframes pulse{0%,45%,100%{opacity:0}12%,33%{opacity:1}}@media(prefers-reduced-motion:no-preference){.pulse{animation:pulse 11s ease-in-out infinite}.second{animation-delay:4.4s}}@media(prefers-reduced-motion:reduce){.moving{display:none}}</style>
