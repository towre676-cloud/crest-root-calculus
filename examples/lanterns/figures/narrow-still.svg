<svg xmlns="http://www.w3.org/2000/svg" width="380" height="619" viewBox="0 0 380 619" role="img" aria-labelledby="title desc">
<title id="title">When two dark lanterns can touch</title>
<desc id="desc">The alternating rule allows 32 eight-lantern rows using dark, amber and blue. Allowing adjacent darks gives 341 rows. In the new example lamps three and four are dark. Under the relaxed rule 171 rows end in dark, and 170 end in a color.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}</style>
<rect width="380" height="619" fill="white"/>
<text x="16" y="37" font-size="29" font-weight="400" fill="#172b39" text-anchor="start" class="serif">When two dark lanterns</text>
<text x="16" y="70" font-size="29" font-weight="400" fill="#172b39" text-anchor="start" class="serif">can touch</text>
<text x="17" y="102" font-size="17" font-weight="400" fill="#465e6d" text-anchor="start" class="">Eight lanterns, left to right.</text>
<text x="17" y="128" font-size="17" font-weight="400" fill="#465e6d" text-anchor="start" class="">D = dark, A = amber, B = blue.</text>
