<text x="16" y="518" text-anchor="start" fill="#172b39" font-size="18" font-weight="bold" class="">Why are there four chains ending in 0?</text>
<text x="16" y="545" text-anchor="start" fill="#42596a" font-size="17" font-weight="normal" class="">Two came from an ending of 1, and two</text>
<text x="16" y="568" text-anchor="start" fill="#42596a" font-size="17" font-weight="normal" class="">came from an ending of 4. That gives 2 + 2.</text>
<path d="M16,589 L364,589" stroke="#c6d4d8" stroke-width="1" fill="none"/>
<text x="16" y="623" text-anchor="start" fill="#172b39" font-size="22" font-weight="bold" class="">At 80 slots</text>
<text x="16" y="656" text-anchor="start" fill="#00766b" font-size="27" font-weight="normal" class="result">2,199,023,255,552 chains</text>
<text x="16" y="683" text-anchor="start" fill="#172b39" font-size="16.5" font-weight="normal" class="">Zeros fill all 40 odd slots or all 40 even slots.</text>
<text x="16" y="705" text-anchor="start" fill="#172b39" font-size="16.5" font-weight="normal" class="">Each other slot holds 1 or 4. Total = 2 × 2⁴⁰.</text>
<text x="16" y="744" text-anchor="start" fill="#42596a" font-size="16.5" font-weight="normal" class="">The program checks 5 × 5 pairs at each join.</text>
<text x="16" y="767" text-anchor="start" fill="#42596a" font-size="16.5" font-weight="normal" class="">79 joins × 25 pairs = 1,975 checks.</text>
</svg>
