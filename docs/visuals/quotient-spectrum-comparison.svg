    <text x="69" y="122" fill="#006d71" font-size="20" font-weight="650" text-anchor="start">Curve A</text>
    <path d="M 184 109 L 190 115 184 121 178 115 Z" fill="#b84613"/>
    <text x="201" y="122" fill="#b84613" font-size="20" font-weight="650" text-anchor="start">Curve B</text>
    <circle cx="324" cy="115" r="9" fill="#fff" stroke="#006d71" stroke-width="3"/>
    <path d="M 324 109 L 330 115 324 121 318 115 Z" fill="#b84613"/>
