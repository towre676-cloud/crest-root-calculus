<line x1="516" y1="256" x2="549" y2="256" stroke="#087e75" stroke-width="5" stroke-linecap="round"/>
<text x="560" y="260" class="note" text-anchor="start">Two couplers</text>
<text x="560" y="280" class="mini" text-anchor="start">P₁–J₁ and P₂–J₂.</text>
<line x1="516" y1="313" x2="549" y2="313" stroke="#ac4723" stroke-width="5" stroke-linecap="round"/>
<text x="560" y="317" class="note" text-anchor="start">Two rockers</text>
<text x="560" y="337" class="mini" text-anchor="start">J₁–G₁ and J₂–G₂.</text>
<text x="515" y="410" class="head" text-anchor="start">Ground pivot directions</text>
<text x="515" y="437" class="note" text-anchor="start">OG₁ is 60° above the crank.</text>
<text x="515" y="460" class="note" text-anchor="start">OG₂ is 60° below the crank.</text>
<text x="515" y="511" class="head" text-anchor="start">Length scale</text>
