    <line x1="104" y1="309" x2="744" y2="309" stroke="#d8e2eb" stroke-width="2"/>
    <text x="91" y="316" fill="#435a70" font-size="19" font-weight="400" text-anchor="end">0</text>
    <line x1="104" y1="281" x2="744" y2="281" stroke="#d8e2eb" stroke-width="1"/>
    <text x="91" y="288" fill="#435a70" font-size="19" font-weight="400" text-anchor="end">4</text>
