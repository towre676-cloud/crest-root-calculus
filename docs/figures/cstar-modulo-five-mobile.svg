<text x="14" y="150" text-anchor="start" class="" style="font-size:17px;fill:#42596a;font-weight:normal">25 points written (x : y : 1)</text>
<text x="23" y="176" text-anchor="middle" class="" style="font-size:18px;fill:#285d9b;font-weight:bold">y</text>
<text x="342" y="365" text-anchor="middle" class="" style="font-size:18px;fill:#285d9b;font-weight:bold">x</text>
<rect class="pass" x="45" y="312" width="277" height="30" rx="3" fill="#e4eef5" style="animation-delay:5.52s"/>
<text x="23" y="333" text-anchor="middle" class="num" style="font-size:18px;fill:#285d9b;font-weight:normal">0</text>
<rect class="pass" x="45" y="278" width="277" height="30" rx="3" fill="#e4eef5" style="animation-delay:4.14s"/>
<text x="23" y="299" text-anchor="middle" class="num" style="font-size:18px;fill:#285d9b;font-weight:normal">1</text>
