<svg xmlns="http://www.w3.org/2000/svg" width="380" height="725" viewBox="0 0 380 725" role="img" aria-labelledby="title desc">
<title id="title">Two target points, two fibres of three</title><desc id="desc">The bounded oval of the elliptic target meets u = −3 at v = 1 and −1. On the quartic in the affine source chart, three circles lie above the upper target and three diamonds above the lower. At the upper target the source points are h = −3, k = 0 and h = 0, k = (1 ± √61)/10. At the lower one all have k = 0.</desc>
