<text x="178" y="242" text-anchor="middle" fill="#285d9b" font-size="16" font-weight="bold" class="">2 slots</text>
<text x="251" y="242" text-anchor="middle" fill="#285d9b" font-size="16" font-weight="bold" class="">3 slots</text>
<text x="329" y="242" text-anchor="middle" fill="#285d9b" font-size="16" font-weight="bold" class="">4 slots</text>
<text x="38" y="280" text-anchor="middle" fill="#285d9b" font-size="19" font-weight="bold" class="">1</text>
