<svg xmlns="http://www.w3.org/2000/svg" width="380" height="787" viewBox="0 0 380 787" role="img" aria-labelledby="title desc">
<title id="title">Counting an 80-slot chain from its last number</title>
<desc id="desc">Each slot contains a number from 0 to 4. Only 0 and 1, or 0 and 4, can be neighbors in either order. The diagram follows chains of one through four slots by their last number. Their totals are 5, 4, 6, and 8. At four slots, two chains from each of endings 1 and 4 give four ending in 0. At 80 slots, there are two choices for which 40 slots are zeros and two choices, 1 or 4, at each other slot. That makes 2,199,023,255,552 valid chains. The program evaluates 79 times 25 possible neighboring pairs, or 1,975 checks.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.title,.result{font-family:Georgia,"Times New Roman",serif}
</style>
<rect width="380" height="787" fill="#fff"/>
<text x="16" y="34" text-anchor="start" fill="#172b39" font-size="27" font-weight="normal" class="title">Counting an 80-slot chain</text>
<text x="16" y="65" text-anchor="start" fill="#42596a" font-size="17.5" font-weight="normal" class="">Each slot holds 0, 1, 2, 3 or 4.</text>
<text x="16" y="90" text-anchor="start" fill="#42596a" font-size="17.5" font-weight="normal" class="">Two neighbors’ squares must add to a</text>
<text x="16" y="113" text-anchor="start" fill="#42596a" font-size="17.5" font-weight="normal" class="">number with remainder 1 after division by 5.</text>
<path d="M16,130 L364,130" stroke="#c6d4d8" stroke-width="1" fill="none"/>
