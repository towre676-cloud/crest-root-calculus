<svg xmlns="http://www.w3.org/2000/svg" width="780" height="352" viewBox="0 0 780 352" role="img" aria-labelledby="title desc">
  <title id="title">One solar home, two predictions for its voltage</title>
  <desc id="desc">A home exports 0.62481 per unit through a line of resistance 0.1 to a source of voltage magnitude 1. The exact squared voltage of the home, 1.121481, lies below the ceiling of 1.123600. The linear upper bound, 1.124962, lies above it. Points on the number line are placed to scale.</desc>
  <rect width="780" height="352" rx="8" fill="#f7fafb"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#173342">
    <text x="28" y="37" font-size="23" font-weight="bold">Can one home export this much?</text>
    <text x="28" y="63" font-size="14">A single resistive line, with all quantities in per unit.</text>
    <text x="50" y="101" font-size="17" font-weight="bold">Source</text>
    <text x="50" y="125" font-size="14">Voltage = 1</text>
    <path d="M149 112 H628" stroke="#536e7a" stroke-width="3" fill="none"/>
    <circle cx="149" cy="112" r="6" fill="#173342"/>
    <circle cx="628" cy="112" r="6" fill="#173342"/>
    <text x="388" y="100" font-size="14" text-anchor="middle">Line resistance = 0.1</text>
    <text x="652" y="104" font-size="17" font-weight="bold">Home</text>
    <text x="652" y="127" font-size="14">V = 1.059</text>
    <path d="M478 138 H304 M304 138 l8 -5 M304 138 l8 5" stroke="#276955" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" fill="none"/>
    <text x="390" y="161" font-size="14" text-anchor="middle">Home exports 0.62481</text>
    <path d="M28 180 H752" stroke="#cbd8de" fill="none"/>
    <text x="28" y="209" font-size="17" font-weight="bold">Squared voltage at the home</text>
    <path d="M86 265 H704" stroke="#9aaab1" stroke-width="1.5" fill="none"/>
    <path d="M86 261 v9 M189 261 v9 M292 261 v9 M395 261 v9 M498 261 v9 M601 261 v9 M704 261 v9" stroke="#9aaab1" stroke-width="1.5" fill="none"/>
    <text x="86" y="289" font-size="12" text-anchor="middle">1.120</text>
    <text x="704" y="289" font-size="12" text-anchor="middle">1.126</text>
    <g fill="#17674f">
      <circle cx="238.543" cy="265" r="6"/>
      <path d="M238.543 247 V257" stroke="#17674f" stroke-width="1.5"/>
      <text x="238.543" y="240" text-anchor="middle" font-size="15" font-weight="bold">AC 1.121481</text>
    </g>
    <g fill="#934c13">
      <path d="M597.086 259 l6 6 -6 6 -6 -6 z"/>
      <path d="M597.086 247 V257" stroke="#934c13" stroke-width="1.5"/>
      <text x="597.086" y="240" text-anchor="middle" font-size="15" font-weight="bold">Linear 1.124962</text>
    </g>
    <path d="M456.8 251 V284" stroke="#263744" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="456.8" y="304" text-anchor="middle" font-size="15" font-weight="bold">Ceiling 1.123600</text>
    <text x="390" y="333" text-anchor="middle" font-size="14">The AC solution meets the ceiling. The upper bound crosses it.</text>
  </g>
</svg>
