const clamp=x=>Math.max(0,Math.min(1,x));

function line(p,c,w=1){g.beginPath();g.moveTo(p[0].x,p[0].y);for(const a of p.slice(1))g.lineTo(a.x,a.y);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke();}
function wall(p,color){g.beginPath();g.moveTo(p[0].x,p[0].y);for(const a of p.slice(1))g.lineTo(a.x,a.y);g.closePath();g.fillStyle=color;g.fill();}
function dot(p,r,c){g.beginPath();g.arc(p.x,p.y,r,0,tau);g.fillStyle=c;g.fill();}
function ring(p,r,c,w=2){g.beginPath();g.arc(p.x,p.y,r,0,tau);g.strokeStyle=c;g.lineWidth=w;g.stroke();}
function box(x,y,w,h,r,col,border){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=col;g.fill();if(border){g.strokeStyle=border;g.lineWidth=1;g.stroke();}}
function arrow(a,b,c,w=2){line([a,b],c,w);const h=Math.atan2(b.y-a.y,b.x-a.x);wall([b,xy(b.x-12*Math.cos(h)+5*Math.sin(h),b.y-12*Math.sin(h)-5*Math.cos(h)),xy(b.x-12*Math.cos(h)-5*Math.sin(h),b.y-12*Math.sin(h)+5*Math.cos(h))],c);}
function orbital(t,a,b,c){const f=t-Math.floor(t),p=M(a,b,f);g.save();g.globalAlpha*=Math.sin(pi*f);g.shadowColor=c;g.shadowBlur=15;dot(p,5,c);g.restore();}

  if(event.code==='ArrowRight'||event.code==='ArrowLeft'){event.preventDefault();focus((active+chapters.length+(event.code==='ArrowRight'?1:-1))%chapters.length);}
});
const transcript=document.querySelector('#transcript');
for(const c of chapters){const li=document.createElement('li');li.textContent=c.title.join(' ')+'. '+c.body.join(' ')+' '+c.takeaway+'.';transcript.appendChild(li);}
function fit(){
  if(!started)return;
  const mobile=isMobile(), pixels=scene.getBoundingClientRect().width;
  scene.width=Math.max(640,Math.min(mobile?900:2160,Math.round(pixels*(window.devicePixelRatio||1)*1.45)));
  scene.height=Math.round(scene.width*(mobile?1420/900:1080/1920));
  layout(t,mobile);
}
function frame(now){
  if(lastTick&&playing)t=(t+Math.min(.2,(now-lastTick)/1000))%duration;
  if(request||playing){layout(t);request=false;}
  lastTick=now;requestAnimationFrame(frame);
}

const evidence=document.querySelector('#evidence');
const intro='Use w = (1 + i√19)/2 and O₃ = ℤ + 3wℤ. Both ideals have index three in ℤ[w]. Both have multiplier ring O₃. The homomorphism coefficients from the second torus to the first lie in the span of 3 and w+2, and adjoint is complex conjugation because the fundamental areas agree.\n\nFor a symmetric endomorphism X, the degree pairing is tr(adj(H)X), and qH(X) = tr(adj(H)X)² − 4 det(X) on the quotient by ℤH. The integer isometry U satisfies transpose(U) QH U = Qarchive.';
const give=(r,k)=>'TWIN '+(k?'B':'A')+'\nArchive Gram matrix '+JSON.stringify(r.original)+'\nOff-diagonal coefficient (constant, w) '+JSON.stringify(r.Hoff)+'\nHumbert Gram matrix in the computed quotient basis '+JSON.stringify(r.q)+'\nIntegral isometry U '+JSON.stringify(r.isometry)+'\nAlternating form in the product period basis '+JSON.stringify(r.R)+'\nNormalized period matrix '+JSON.stringify(period[k])+'\nOdd characteristic indices sent to 0, 1, and infinity '+JSON.stringify(r.anchors)+'\nRosenhain entries, numerical '+r.pretty_rosenhain.join(', ')+ '\nAbsolute Igusa ratios (I2^5/I10, I2^3 I4/I10, I2^2 I6/I10), numerical '+r.pretty_igusa_abs.join(', ');
evidence.textContent='Certified equation-to-lattice replay. One example of the recorded half-period bijections and integral isometries follows. Both quartic curves are checked via their degree-24 models at all 24 embeddings. Label order is 1/2, tau/2, (1+tau)/2. The zero-based permutation entries in the record refer to that order.\n'+JSON.stringify(exampleGluing,null,2)+'\n\nQuartic descent. Starting from u=s1^3+s2^3, v=s1s2, put D=u^2−4v^3. The affine sextic has coefficients a,b,c,d,Dc,D^2b,D^3a in descending order, where a=u−v^2, b=3D+3u^2−2uv^2, c=D(15u+v^2), d=2D(5D+5u^2+2uv^2). The normalized absolute ratio I2^5/I10 agrees with the archive at the conjugate of its recorded complex embedding.\n\n'+intro+'\n\n'+records.map(give).join('\n\n');
window.addEventListener('resize',fit);
const ready=Promise.all([
  document.fonts.load('400 25px PlateSans'),document.fonts.load('600 25px PlateSans'),document.fonts.load('400 25px PlateMath'),
  (photo=new Image(),photo.src=plateSrc,photo.decode())
]).then(()=>{started=true;fit();setPlaying(playing);requestAnimationFrame(frame);});
window.crestTwins={ready,duration,chapters,
  get time(){return t;},get playing(){return playing;},
  show(time,mobile){setPlaying(false);t=Math.max(0,Math.min(duration-.001,time));layout(t,mobile);}
};
