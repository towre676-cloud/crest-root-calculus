<text x="24" y="476" text-anchor="start" fill="#172b39" font-size="24" font-weight="bold" class="">At 80 slots</text>
<text x="183" y="477" text-anchor="start" fill="#00766b" font-size="31" font-weight="normal" class="result">2,199,023,255,552 chains</text>
<text x="24" y="507" text-anchor="start" fill="#172b39" font-size="17.5" font-weight="normal" class="">Zeros fill the 40 odd or the 40 even slots. Each other slot holds 1 or 4. Total = 2 × 2⁴⁰.</text>
<text x="24" y="537" text-anchor="start" fill="#42596a" font-size="17.5" font-weight="normal" class="">The program checks all 5 × 5 pairs at each join. 79 joins × 25 pairs = 1,975 checks.</text>
