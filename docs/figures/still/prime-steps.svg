<text x="59.00" y="166.12" font-size="16" font-weight="400" text-anchor="end" class="" style="fill:#465e6d">16</text>
<path d="M67.00 151.00L67.00 323.00" stroke="#81949d" stroke-width="1.2" fill="none" />
<path d="M88.32 323.00L88.32 328.00" stroke="#465e6d" stroke-width="1.2" fill="none" />
<text x="88.32" y="346.00" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#465e6d">2</text>
<path d="M152.29 323.00L152.29 328.00" stroke="#465e6d" stroke-width="1.2" fill="none" />
<text x="152.29" y="346.00" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#465e6d">5</text>
