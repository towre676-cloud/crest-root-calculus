<svg xmlns="http://www.w3.org/2000/svg" width="780" height="558" viewBox="0 0 780 558" role="img" aria-labelledby="title desc">
<title id="title">Counting an 80-slot chain from its last number</title>
<desc id="desc">Each slot contains a number from 0 to 4. Only 0 and 1, or 0 and 4, can be neighbors in either order. The diagram follows chains of one through four slots by their last number. Their totals are 5, 4, 6, and 8. At four slots, two chains from each of endings 1 and 4 give four ending in 0. At 80 slots, there are two choices for which 40 slots are zeros and two choices, 1 or 4, at each other slot. That makes 2,199,023,255,552 valid chains. The program evaluates 79 times 25 possible neighboring pairs, or 1,975 checks.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.title,.result{font-family:Georgia,"Times New Roman",serif}
.trace{opacity:0;stroke-dasharray:1;stroke-dashoffset:1}.halo{opacity:0}@keyframes sweep{0%,4%{opacity:0;stroke-dashoffset:1}7%{opacity:1}20%,53%{opacity:1;stroke-dashoffset:0}64%,100%{opacity:0;stroke-dashoffset:0}}@keyframes hold{0%,18%,65%,100%{opacity:0}22%,52%{opacity:1}}@media(prefers-reduced-motion:no-preference){.trace{animation:sweep 13s linear infinite}.halo{animation:hold 13s linear infinite}}
</style>
