<svg xmlns="http://www.w3.org/2000/svg" width="360" height="762" viewBox="0 0 360 762" role="img" aria-labelledby="title desc">
<title id="title">Eight points on C⋆ modulo 5</title>
<desc id="desc">All 31 positions in the projective plane over the field of five elements are labeled with the quartic's remainder. The six affine zeros are (1,0), (4,2), (0,3), (3,3), (4,3), and (3,4). Two more lie at infinity at (2:1:0) and (3:1:0). Separate map tests mark (1:0:1) and (2:1:0), both giving the same quotient class over this field. A faint highlight moves across the rows, then pauses; all entries remain visible.</desc>
<style>
text { font-family:Arial,Helvetica,sans-serif;fill:#172b39 }
.title {font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:34px}
.num {font-family:"DejaVu Sans Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.pass {opacity:0}
@media (prefers-reduced-motion:no-preference) {
  .pass {animation:pass 24s ease-in-out infinite}
}
@keyframes pass {0%,6%,100% {opacity:0} 0.9%,4.8% {opacity:1}}
</style>
<rect width="360" height="762" fill="white"/>
<text x="13" y="34" text-anchor="start" class="title" style="font-size:27px;fill:#172b39;font-weight:normal">Eight points on C⋆ modulo 5</text>
<text x="14" y="61" text-anchor="start" class="" style="font-size:17px;fill:#42596a;font-weight:normal">Each entry is the quartic’s remainder</text>
<text x="14" y="82" text-anchor="start" class="" style="font-size:17px;fill:#42596a;font-weight:normal">after division by 5.</text>
