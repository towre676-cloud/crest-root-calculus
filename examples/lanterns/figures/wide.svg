<svg xmlns="http://www.w3.org/2000/svg" width="780" height="434" viewBox="0 0 780 434" role="img" aria-labelledby="title desc">
<title id="title">When two dark lanterns can touch</title>
<desc id="desc">The alternating rule allows 32 eight-lantern rows using dark, amber and blue. Allowing adjacent darks gives 341 rows. In the new example lamps three and four are dark. Under the relaxed rule 171 rows end in dark, and 170 end in a color.</desc>
