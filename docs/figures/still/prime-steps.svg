<text x="25.00" y="443.00" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#285d9b">One line</text>
<text x="109.00" y="443.00" font-size="22" font-weight="400" text-anchor="start" class="serif" style="fill:#172b39">³⁄₂ × ⁴⁄₃ × ⁶⁄₅ = 2.40</text>
<text x="401.00" y="443.00" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#00766b">Two lines</text>
<text x="494.00" y="443.00" font-size="22" font-weight="400" text-anchor="start" class="serif" style="fill:#172b39">2.40² = 5.76</text>
</svg>
