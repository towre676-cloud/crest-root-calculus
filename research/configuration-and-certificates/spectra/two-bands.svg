<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 282" role="img" aria-labelledby="title desc"><title id="title">Two wavelengths demand incompatible calcite shares</title><desc id="desc">For USGS GDS212 at tolerance 0.005, permitted affine calcite fractions are 33.35 to 37.65 percent at 1.4935 micrometres and 97.38 to 100 percent at 2.2750 micrometres.</desc><rect rx="12" width="600" height="282" fill="#faf9f4"/><g font-family="Arial, sans-serif">
