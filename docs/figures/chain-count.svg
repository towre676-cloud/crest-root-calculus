<text x="24" y="43" text-anchor="start" fill="#172b39" font-size="34" font-weight="normal" class="title">Counting an 80-slot chain</text>
<text x="24" y="73" text-anchor="start" fill="#42596a" font-size="18" font-weight="normal" class="">Each slot holds 0, 1, 2, 3 or 4. Two neighbors’ squares must add to 1 modulo 5.</text>
