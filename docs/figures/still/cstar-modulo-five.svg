<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" role="img" aria-labelledby="title desc">
<title id="title">Eight points on C⋆ modulo 5</title>
<desc id="desc">All 31 positions in the projective plane over the field of five elements are labeled with the quartic's remainder. The six affine zeros are (1,0), (4,2), (0,3), (3,3), (4,3), and (3,4). Two more lie at infinity at (2:1:0) and (3:1:0). Separate map tests mark (1:0:1) and (2:1:0), both giving the same quotient class over this field.</desc>
<style>
text { font-family:Arial,Helvetica,sans-serif;fill:#172b39 }
.title {font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:34px}
.num {font-family:"DejaVu Sans Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

</style>
<rect width="760" height="492" fill="white"/>
<text x="24" y="43" text-anchor="start" class="title" style="font-size:34px;fill:#172b39;font-weight:normal">Eight points on C⋆ modulo 5</text>
<text x="25" y="74" text-anchor="start" class="" style="font-size:19px;fill:#42596a;font-weight:normal">Each entry gives the remainder after dividing the quartic’s value by 5.</text>
