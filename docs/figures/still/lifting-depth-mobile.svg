<svg xmlns="http://www.w3.org/2000/svg" width="380" height="588" viewBox="0 0 380 588" role="img" aria-labelledby="title desc">
<title id="title">How long can a false candidate survive?</title>
<desc id="desc">All four quartics reduce to the Fermat quartic modulo 13, with 16 degree-three quotient classes and two marked points per class. The Fermat curve has 16 exact geometric classes. Adding 13, 169 or 2197 times the displayed polynomial rules out all classes at modulus 169, 2197 or 28561 respectively.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b39}
.math{font-family:Georgia,"Times New Roman","DejaVu Serif",serif}

</style>
<rect width="380" height="588" fill="#fff"/>
<text x="16" y="37" text-anchor="start" class="math" font-size="30" font-weight="400" style="fill:#172b39">How long can a false</text>
<text x="16" y="72" text-anchor="start" class="math" font-size="30" font-weight="400" style="fill:#172b39">candidate survive?</text>
<text x="16" y="105" text-anchor="start" class="" font-size="18" font-weight="400" style="fill:#435c69">Each new test keeps one more base-13</text>
<text x="16" y="128" text-anchor="start" class="" font-size="18" font-weight="400" style="fill:#435c69">digit in the equations.</text>
<text x="16" y="166" text-anchor="start" class="math" font-size="23" font-weight="400" style="fill:#172b39">F = X⁴ + Y⁴ + Z⁴</text>
<text x="16" y="195" text-anchor="start" class="math" font-size="23" font-weight="400" style="fill:#172b39">D = −5X²Z² − 4Y²Z²</text>
<path d="M16 211 L364 211" fill="none" stroke="#d7e0e2" stroke-width="1"/>
<text x="227" y="240" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#435c69">Term added to F</text>
<path d="M94 250 L356 250" fill="none" stroke="#d7e0e2" stroke-width="1"/>
<text x="16" y="274" text-anchor="start" class="" font-size="17" font-weight="700" style="fill:#172b39">Modulus</text>
<text x="124" y="274" text-anchor="middle" class="math" font-size="19" font-weight="400" style="fill:#172b39">0</text>
<text x="192" y="274" text-anchor="middle" class="math" font-size="19" font-weight="400" style="fill:#172b39">13D</text>
<text x="260" y="274" text-anchor="middle" class="math" font-size="19" font-weight="400" style="fill:#172b39">13²D</text>
<text x="328" y="274" text-anchor="middle" class="math" font-size="19" font-weight="400" style="fill:#172b39">13³D</text>
<text x="16" y="311" text-anchor="start" class="" font-size="19" font-weight="700" style="fill:#172b39">13</text>
<text x="16" y="364" text-anchor="start" class="" font-size="19" font-weight="700" style="fill:#172b39">169</text>
<text x="16" y="417" text-anchor="start" class="" font-size="19" font-weight="700" style="fill:#172b39">2,197</text>
<text x="16" y="470" text-anchor="start" class="" font-size="19" font-weight="700" style="fill:#172b39">28,561</text>
<path d="M124 304 L124 357" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M124 357 L124 410" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M124 410 L124 463" fill="none" stroke="#77a9a3" stroke-width="2"/>
<circle cx="124" cy="304" r="17" fill="#00766b"/>
<text x="124" y="310" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="124" cy="357" r="17" fill="#00766b"/>
<text x="124" y="363" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="124" cy="410" r="17" fill="#00766b"/>
<text x="124" y="416" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="124" cy="463" r="17" fill="#00766b"/>
<text x="124" y="469" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<text x="124" y="517" text-anchor="middle" class="" font-size="25" font-weight="700" style="fill:#00766b">16</text>
<path d="M192 304 L192 357" fill="none" stroke="#91796d" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="192" cy="304" r="17" fill="#00766b"/>
<text x="192" y="310" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<path d="M192 338l19 19-19 19-19-19z" fill="#fff8f5" stroke="#b34826" stroke-width="2.4"/>
<text x="192" y="364" text-anchor="middle" class="" font-size="20" font-weight="700" style="fill:#b34826">0</text>
<text x="192" y="517" text-anchor="middle" class="" font-size="25" font-weight="700" style="fill:#b34826">0</text>
<path d="M260 304 L260 357" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M260 357 L260 410" fill="none" stroke="#91796d" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="260" cy="304" r="17" fill="#00766b"/>
<text x="260" y="310" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="260" cy="357" r="17" fill="#00766b"/>
<text x="260" y="363" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<path d="M260 391l19 19-19 19-19-19z" fill="#fff8f5" stroke="#b34826" stroke-width="2.4"/>
<text x="260" y="417" text-anchor="middle" class="" font-size="20" font-weight="700" style="fill:#b34826">0</text>
<text x="260" y="517" text-anchor="middle" class="" font-size="25" font-weight="700" style="fill:#b34826">0</text>
<path d="M328 304 L328 357" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M328 357 L328 410" fill="none" stroke="#77a9a3" stroke-width="2"/>
<path d="M328 410 L328 463" fill="none" stroke="#91796d" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="328" cy="304" r="17" fill="#00766b"/>
<text x="328" y="310" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="328" cy="357" r="17" fill="#00766b"/>
<text x="328" y="363" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<circle cx="328" cy="410" r="17" fill="#00766b"/>
<text x="328" y="416" text-anchor="middle" class="" font-size="18" font-weight="700" style="fill:#fff">16</text>
<path d="M328 444l19 19-19 19-19-19z" fill="#fff8f5" stroke="#b34826" stroke-width="2.4"/>
<text x="328" y="470" text-anchor="middle" class="" font-size="20" font-weight="700" style="fill:#b34826">0</text>
<text x="328" y="517" text-anchor="middle" class="" font-size="25" font-weight="700" style="fill:#b34826">0</text>
<path d="M16 490 L364 490" fill="none" stroke="#d7e0e2" stroke-width="1"/>
<text x="16" y="517" text-anchor="start" class="" font-size="19" font-weight="700" style="fill:#172b39">Exact</text>
<text x="16" y="552" text-anchor="start" class="" font-size="17" font-weight="400" style="fill:#435c69">Numbers count degree-three quotient classes.</text>
<text x="16" y="575" text-anchor="start" class="" font-size="17" font-weight="400" style="fill:#435c69">A column ends when every lift fails.</text>
</svg>
