<text x="16" y="183" text-anchor="start" fill="#42596a" font-size="17" font-weight="normal" class="">Read from left to right. Follow a line to</text>
<text x="16" y="205" text-anchor="start" fill="#42596a" font-size="17" font-weight="normal" class="">add one allowed neighbor.</text>
