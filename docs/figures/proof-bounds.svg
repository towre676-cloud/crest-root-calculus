<svg xmlns="http://www.w3.org/2000/svg" width="780" height="434" viewBox="0 0 780 434" role="img" aria-labelledby="title desc"><title id="title">When is the count complete?</title><desc id="desc">Two rows for each curve show the whole-number totals allowed by the lower and upper bounds. For C-star the range from zero to one closes on one. For the perturbation F+13D the range from zero to sixteen closes on zero.</desc>
