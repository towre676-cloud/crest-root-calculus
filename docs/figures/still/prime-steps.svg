<svg xmlns="http://www.w3.org/2000/svg" width="780" height="465" viewBox="0 0 780 465" role="img" aria-labelledby="title desc"><title id="title">Multiplying the counts, prime by prime</title><desc id="desc">A step graph for primes up to 31. One projective line gives the lower product. The product of two lines gives the square at every prime. At 5 the exact values are 2.4 and 5.76.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b39}.serif{font-family:Georgia,"Times New Roman",serif}</style>
<rect width="780" height="465" fill="#fff"/>
<text x="24.00" y="45.00" font-size="34" font-weight="400" text-anchor="start" class="serif" style="fill:#172b39">Multiplying the counts, prime by prime</text>
<text x="25.00" y="78.00" font-size="19" font-weight="400" text-anchor="start" class="" style="fill:#465e6d">The product changes only when a new prime enters the count.</text>
<path d="M27.00 108.00L56.00 108.00" stroke="#285d9b" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
<text x="64.00" y="114.00" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#285d9b">One line</text>
