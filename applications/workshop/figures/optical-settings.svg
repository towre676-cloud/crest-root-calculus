<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315" role="img" aria-labelledby="title desc"><title id="title">Which optical readings settle the width grade?</title><desc id="desc">Out of 2566 NIST simulated profiles, one channel settles 927, a nearby second angle settles 951, a second polarization settles 1649, and all 84 settings settle 2533. A second polarization settles 698 more cases than a second angle.</desc><rect x="0" y="0" width="760" height="315" fill="#fcfbf6" /><text x="22" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" fill="#203433" text-anchor="start">Which optical readings settle the width grade?</text><text x="23" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#203433" text-anchor="start">NIST simulations · 2,566 line profiles · maximum bottom width 135 nm</text><text x="23" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#203433" text-anchor="start">One straight-on reading</text><rect x="268" y="92" width="365" height="14" fill="#e6ebe2" /><rect x="268" y="92" width="131.86087295401404" height="14" fill="#718c81" /><text x="663" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#203433" text-anchor="start">927</text><text x="23" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#203433" text-anchor="start">Add a nearby angle</text><rect x="268" y="132" width="365" height="14" fill="#e6ebe2" /><rect x="268" y="132" width="135.27474668745128" height="14" fill="#718c81" /><text x="663" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#203433" text-anchor="start">951</text><text x="23" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#203433" text-anchor="start">Add orthogonal polarization</text><rect x="268" y="172" width="365" height="14" fill="#e6ebe2" /><rect x="268" y="172" width="234.56157443491816" height="14" fill="#00645d" /><text x="663" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#203433" text-anchor="start">1,649</text><text x="23" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#203433" text-anchor="start">Use all 84 settings</text><rect x="268" y="212" width="365" height="14" fill="#e6ebe2" /><rect x="268" y="212" width="360.3059236165238" height="14" fill="#344e48" /><text x="663" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#203433" text-anchor="start">2,533</text><text x="23" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#203433" text-anchor="start">Both two-reading choices start with the same optical setting.</text><text x="23" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4c6159" text-anchor="start">Each count includes every allowed intensity error up to ±0.001 on the simulated grid.</text></svg>